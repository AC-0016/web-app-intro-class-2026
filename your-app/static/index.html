<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logbook App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>家計簿</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 家計簿記載エリア -->
      <form id="logbook-form" class="input-area">
        <input
          type="date"
          id="date-input"
          class="todo-input"
          required
        />

        <!-- selectでtypeに入れる値を収入or支出に決めさせる。 -->

        <select
          id="type-input"
          class="todo-input"
          required
        >
          <option value="">種類を選択</option>
          <option value="収入">収入</option>
          <option value="支出">支出</option>
        </select>

        <!-- selectでtypeに入れる値を選択する -->
        <select
          id="category-input"
          class="todo-input"
          required
        >
          <option value="">カテゴリ選択</option>
          <option value="家賃">家賃</option>
          <option value="食費">食費</option>
          <option value="日用品費">日用品費</option>
          <option value="水道光熱費">水道光熱費</option>
          <option value="交通費">交通費</option>
          <option value="通信費">通信費</option>
          <option value="医療費">医療費</option>
          <option value="衣服費">衣服費</option>
          <option value="その他">その他</option>
          <option value="追加">追加</option>
        </select>

        <!-- 金額、メモはそれぞれ別のカラムとして定義しているためinputが3つ必要になる。また、カテゴリのその他の枠があるためカテゴリも追加 -->

        <input
          type="text"
          id="custom-category-input"
          class="todo-input"
          placeholder=""
          style="display: none;"
        />

        <input
          type="number"
          id="amount-input"
          class="todo-input"
          placeholder="金額"
          required
        />

        <input
          type="text"
          id="memo-input"
          class="todo-input"
          placeholder="メモ"
        />

        <!-- 追加ボタンと電卓ボタンをまとめる -->
        <div class="add-button-area">
          <button type="submit" class="todo-button">追加</button>
          <button
            type="button"
            id="calculator-button"
            class="calculator-button"
          >
            電卓
          </button>
        </div>

        <button
          type="button"
          id="sort-button"
          class="sort-button"
        >
          切替
        </button>

        <button
          type="button"
          id="month-button"
          class="month-button"
        >
          管理
        </button>

        <!-- selectで選択する月をプルダウン方式にする。 -->
        <select
          id="month-select"
          class="month-select"
          style="display: none;"
        >
          <option value="">月を選択</option>
        </select>
      </form>

      <!-- 家計簿一覧 -->
      <ul id="todo-list" class="todo-list"></ul>

      <!-- 円グラフ表示エリア -->
      <div class="charts-area">
        <!-- 収入 -->
        <div class="chart-card">
          <h2>収入</h2>
          <canvas id="income-chart"></canvas>
        </div>

        <!-- 支出 -->
        <div class="chart-card">
          <h2>支出</h2>
          <canvas id="expense-chart"></canvas>
        </div>
      </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 Logbook App</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
