<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logbook App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>家計簿</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 家計簿記載エリア -->
      <form id="logbook-form" class="input-area">
  <input
    type="date"
    id="date-input"
    class="todo-input"
    required
  />

  <!-- selectでtypeに入れる値を収入or支出に決めさせる。 -->
  
     <select 
    id="type-input"
    class="todo-input"
    required
  >
    <option value="">種類を選択</option>
    <option value="収入">収入</option>
    <option value="支出">支出</option>
  </select>

  <!-- カテゴリ、金額、メモはそれぞれ別のカラムとして定義しているためinputが3つ必要になる。 -->
  <input
    type="text"
    id="category-input"
    class="todo-input"
    placeholder="カテゴリ"
    required
  />

  <input
    type="number"
    id="amount-input"
    class="todo-input"
    placeholder="金額"
    required
  />

  <input
    type="text"
    id="memo-input"
    class="todo-input"
    placeholder="メモ"
  />

  <button type="submit" class="todo-button">追加</button>

</form>

      <!-- 家計簿一覧 -->
      <ul id="todo-list" class="todo-list"></ul>
      <!-- 円グラフ表示エリア -->
<div class="charts-area">
  <!-- 収入 -->
  <div class="chart-card">
    <h2>収入</h2>
    <canvas id="income-chart"></canvas>
  </div>

  <!-- 支出 -->
  <div class="chart-card">
    <h2>支出</h2>
    <canvas id="expense-chart"></canvas>
  </div>
</div>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 Logbook App</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
